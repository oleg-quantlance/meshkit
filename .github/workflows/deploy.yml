name: Build, Test, Audit & Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Golden Vector, File Validation & >=90% Core Coverage Tests
        run: npm test

      - name: Build production multi-page bundle
        run: npm run build

      - name: Install Playwright Browsers & Run E2E + Axe Accessibility Tests
        run: npx playwright install --with-deps && npm run test:e2e

      - name: Run Lighthouse CI Budgets (SEO 100, A11y >=95, Perf >=90)
        run: npx @lhci/cli@0.14.x autorun

      - name: Deploy Pull Request to Firebase Preview Channel
        if: github.event_name == 'pull_request' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: meshkit-e1c10

      - name: Deploy to Firebase Hosting (Production on main)
        if: github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: meshkit-e1c10

      - name: Ping IndexNow on Production Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "meshkit.pro",
              "key": "8f4b2e9a1c3d5e7f9a0b2c4d6e8f0a1b",
              "keyLocation": "https://meshkit.pro/8f4b2e9a1c3d5e7f9a0b2c4d6e8f0a1b.txt",
              "urlList": [
                "https://meshkit.pro/",
                "https://meshkit.pro/3d-print-cost-calculator",
                "https://meshkit.pro/stl-repair-online",
                "https://meshkit.pro/stl-volume-weight-calculator",
                "https://meshkit.pro/step-to-stl-converter",
                "https://meshkit.pro/resin-3d-print-cost-calculator",
                "https://meshkit.pro/filament-spool-weight-calculator",
                "https://meshkit.pro/empty-spool-weight-database",
                "https://meshkit.pro/filament-grams-to-meters",
                "https://meshkit.pro/3mf-to-stl-converter",
                "https://meshkit.pro/stl-to-3mf-converter",
                "https://meshkit.pro/stl-ascii-to-binary-converter",
                "https://meshkit.pro/obj-to-stl-converter",
                "https://meshkit.pro/stl-viewer-online",
                "https://meshkit.pro/embed"
              ]
            }' || true
